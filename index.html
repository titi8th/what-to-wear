<!doctype html>
<html lang="ko">
<head>

<style>
/* Layout: one phone-width column (max 480px). The hero card is the only bold surface and takes its color from the sky; everything else is quiet cards on a cool grey ground. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --sunk:#F1F4F8; --line:#D8E0E8;
  --fg:#111A24; --muted:#4A5868; --accent:#1F4E9C; --accent-soft:#DCE7F7; --on-accent:#FFFFFF;
  --must:#9A3412; --must-soft:#FFEDD5; --ok:#166534; --ok-soft:#DCFCE7;
  --note-bg:#FEF3C7; --note-fg:#713F12;
  --cold:#3B82F6; --fine:#94A3B8; --hot:#EA7A2C;
  --sky-sun:#0F6E80; --sky-cloud:#46566A; --sky-rain:#1E3A7A; --sky-snow:#56677F; --sky-night:#26314A;
  --on-sky:#FFFFFF; --stage:#E6ECF2; --on-sky-muted:#D8E6F2;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#161F29; --sunk:#1E2934; --line:#2A3745;
  --fg:#E7EDF3; --muted:#A4B2C1; --accent:#8DB4F0; --accent-soft:#1D3150; --on-accent:#0D131A;
  --must:#FDBA74; --must-soft:#3A2414; --ok:#86EFAC; --ok-soft:#13301E;
  --note-bg:#3A3010; --note-fg:#FDE68A;
  --sky-sun:#0B5764; --sky-cloud:#36455A; --sky-rain:#182F66; --sky-snow:#45556C; --sky-night:#1E2840; --stage:#D5DDE6;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#161F29; --sunk:#1E2934; --line:#2A3745;
  --fg:#E7EDF3; --muted:#A4B2C1; --accent:#8DB4F0; --accent-soft:#1D3150; --on-accent:#0D131A;
  --must:#FDBA74; --must-soft:#3A2414; --ok:#86EFAC; --ok-soft:#13301E;
  --note-bg:#3A3010; --note-fg:#FDE68A;
  --sky-sun:#0B5764; --sky-cloud:#36455A; --sky-rain:#182F66; --sky-snow:#45556C; --sky-night:#1E2840; --stage:#D5DDE6;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top .where{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.place{font-size:20px;font-weight:700;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--sunk);border-radius:14px;padding:4px}
.tab{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.soft[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;font-weight:700;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.hero{border-radius:20px;padding:20px;color:var(--on-sky);display:flex;flex-direction:column;gap:14px}
.hero .big{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;letter-spacing:-1px}
.hero .sub{color:var(--on-sky-muted);font-size:14px}
.hero .label{color:var(--on-sky-muted);font-size:12px}
.hero .val{font-family:var(--mono);font-size:16px;font-weight:600}
.headline{background:var(--note-bg);color:var(--note-fg);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hour{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sunk);border-radius:12px;padding:8px 4px;font-size:12px}
.hour b{font-family:var(--mono);font-size:14px}
.hour .pp{color:var(--accent);font-family:var(--mono)}
.seg{display:grid;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.compare{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);align-items:center;gap:8px}
.cbox{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.cbox.now{background:var(--accent-soft);color:var(--accent)}
.cbox .t{font-family:var(--mono);font-size:18px;font-weight:600}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .name{font-weight:700}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.miss{background:var(--must-soft);color:var(--must)}
.bring{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.b{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--sunk)}
.b.must{background:var(--accent-soft);color:var(--accent)}
.b .bt{font-weight:700}
.b .bn{font-size:12px;color:var(--muted)}
.b.must .bn{color:var(--accent)}
.look{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--stage);border-radius:14px;padding:10px 8px 8px;position:relative;overflow:hidden}
.look .ph{width:100%;max-width:300px;aspect-ratio:2/3;border-radius:12px;object-fit:cover;background:var(--sunk);display:block}
.look .wait{position:absolute;inset:10px 8px auto;display:flex;align-items:center;justify-content:center;aspect-ratio:2/3;max-width:300px;margin:0 auto;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.look .lseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:12px;padding:3px;width:100%;max-width:300px}
.look .lseg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:13px;color:var(--muted)}
.look .lseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.look svg{max-width:100%;height:auto}
.look .cap{font-size:12px;color:var(--muted);text-align:center}
.planbox{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.lines{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bag{display:flex;gap:14px;align-items:center}
.bagicon{width:52px;height:52px;border-radius:14px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.status{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.results{display:flex;flex-direction:column;gap:6px}
.result{min-height:44px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px}
.temps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.temps3 button{min-height:80px;border-radius:14px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700}
.temps3 button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.hist{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.hist span{height:28px;border-radius:4px;background:var(--sunk)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.foot a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<script>
(function(){

 ['상의',[['tee_s','반팔 티'],['tee_l','긴팔 티'],['thinturtle','얇은 목티'],['shirt','셔츠'],['linen','린넨 셔츠'],['knit','니트'],['vest','니트 조끼'],['turtle','두꺼운 터틀넥'],['sweat','맨투맨'],['hoodie','후드티'],['heattech','발열 내의'],['sporttee','기능성 티'],['rashguard','래시가드']]],
 ['하의',[['slacks','슬랙스'],['jeans','청바지'],['cotton','면바지'],['skirt','스커트'],['fleece','기모 바지'],['shorts','반바지'],['training','트레이닝 바지'],['swim','수영복']]],
 ['신발',[['loafer','로퍼'],['sneakers','운동화'],['boots','첼시부츠'],['rainboots','레인부츠'],['sandals','샌들'],['aqua','아쿠아슈즈']]],
 ['소품',[['umbrella','접이식 우산'],['sunglass','선글라스'],['cap','모자'],['muffler','머플러'],['gloves','장갑'],['towel','비치타월']]]
];
var NAME={};
CATALOG.forEach(function(c){c[1].forEach(function(p){NAME[p[0]]=p[1];});});
var DEFAULT_CLOSET=['lightpad','wool','trench','blazer','cardigan','windbreaker','tee_s','tee_l','thinturtle','shirt','knit','turtle','sweat','hoodie','heattech','slacks','jeans','cotton','shorts','training','loafer','sneakers','boots','sandals','umbrella','sunglass','cap','muffler'];

var ACT={
 work:{label:'출근',win:[8,19],mod:0},
 out:{label:'나들이',win:[10,20],mod:0},
 sport:{label:'운동',win:[7,9],mod:5},
 water:{label:'물놀이',win:[11,17],mod:0},
 fish:{label:'낚시',win:[5,14],mod:-2},
 trip:{label:'여행',win:[9,22],mod:0}
};
var ACT_ORDER=['work','out','sport','water','fish','trip'];

var BASES=[['work','출근처럼 단정하게'],['out','나들이처럼 편하게'],['sport','운동복'],['water','물놀이'],['fish','야외에 오래 (낚시·캠핑)'],['trip','여행·관광']];

var PRESETS=[{label:'골프',base:'out',h0:7,h1:14,io:2},{label:'등산',base:'sport',h0:8,h1:15,io:2},{label:'학회',base:'work',h0:8,h1:18,io:0},{label:'캠핑',base:'fish',h0:14,h1:23,io:2},{label:'데이트',base:'out',h0:12,h1:22,io:1}];
function customAct(){for(var i=0;i<S.acts.length;i++){if(S.acts[i].id===S.activity)return S.acts[i];}return null;}
function K(){if(ACT[S.activity])return S.activity;var c=customAct();return c?c.base:'work';}
function curAct(){
  if(ACT[S.activity]) return ACT[S.activity];
  var c=customAct();
  if(!c) return ACT.work;
  return {label:c.label,win:[c.h0,c.h1],mod:ACT[c.base].mod+IO[c.io].v};
}
var SENS=[{label:'추위를 타요',v:-2},{label:'보통이에요',v:0},{label:'더위를 타요',v:2}];
var QUICK=[{name:'서울, 대한민국',lat:37.5665,lon:126.978},{name:'바르셀로나, 스페인',lat:41.3874,lon:2.1686},{name:'부산, 대한민국',lat:35.1796,lon:129.0756},{name:'도쿄, 일본',lat:35.6762,lon:139.6503}];

/* ---------- 저장 ---------- */
function load(){
  var d={};
  try{d=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){d={};}
  var closet=d.closet;
  if(!closet){closet={};DEFAULT_CLOSET.forEach(function(i){closet[i]=true;});}
  return {
    closet:closet, sens:(typeof d.sens==='number'?d.sens:1), makeup:(d.makeup!==false), model:d.model||'f', look:d.look||'photo', pkey:d.pkey||'',
    home:d.home||{name:'서울, 대한민국',lat:37.5665,lon:126.978},
    place:d.place||null, fb:d.fb||[], activity:d.activity||'work', custom:d.custom||[], plan:d.plan||null, day:null, acts:d.acts||[], addingAct:false,
    na:{label:'',base:'out',h0:9,h1:18,io:1}, actMsg:'',

    newCat:'아우터', newWarm:2, newName:'', addMsg:''
  };
}
var S=load();
function registerCustom(){S.custom.forEach(function(c){NAME[c.id]=c.name;});}
registerCustom();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({closet:S.closet,sens:S.sens,makeup:S.makeup,model:S.model,look:S.look,pkey:S.pkey,home:S.home,place:S.place,fb:S.fb,activity:S.activity,custom:S.custom,plan:S.plan,acts:S.acts}));}catch(e){}
}
var WARM={'아우터':['얇은 겉옷 (가디건급)','자켓 (트렌치·가죽급)','코트·패딩'],'상의':['얇음 (반팔·셔츠)','보통 (긴팔·맨투맨)','두꺼움 (니트)'],'하의':['얇음 (린넨·반바지)','보통 (청바지·슬랙스)','두꺼움 (기모)']};

var W=null, HOMEW=null, AQ=null, status='', loading=false;

/* ---------- 유틸 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function max(a){return a.length?Math.max.apply(null,a):0;}
function min(a){return a.length?Math.min.apply(null,a):0;}
function r(n){return Math.round(n);}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}
function distKm(a,b){
  var R=6371,toR=Math.PI/180;
  var dLat=(b.lat-a.lat)*toR,dLon=(b.lon-a.lon)*toR;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function shortName(n){return String(n||'').split(',')[0];}
function wa(w){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+'와';return w+((c-0xAC00)%28?'과':'와');}
function skyKind(code,isDay){
  if(code==null) return 'cloud';
  if(code>=71&&code<=77||code===85||code===86) return 'snow';
  if(code>=51&&code<=67||code>=80&&code<=82||code>=95) return 'rain';
  if(code===45||code===48||code===2||code===3) return 'cloud';
  return isDay===0?'night':'sun';
}
function skyText(code){
  var m={0:'맑음',1:'대체로 맑음',2:'구름 조금',3:'흐림',45:'안개',48:'안개',51:'약한 이슬비',53:'이슬비',55:'강한 이슬비',56:'어는 이슬비',57:'어는 이슬비',61:'약한 비',63:'비',65:'강한 비',66:'어는 비',67:'어는 비',71:'약한 눈',73:'눈',75:'많은 눈',77:'싸락눈',80:'소나기',81:'소나기',82:'강한 소나기',85:'눈 소나기',86:'눈 소나기',95:'뇌우',96:'우박 뇌우',99:'우박 뇌우'};
  return m[code]||'—';
}

  var cloud='<path d="M7 16a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.5 10 3.5 3.5 0 0 1 17 17H7z"/>';
  var body={
    sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    night:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    cloud:cloud,
    rain:'<path d="M7 14a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.5 8 3.5 3.5 0 0 1 17 15H7z"/><path d="M9 18l-1 2M13 18l-1 2M17 18l-1 2"/>',

/* ---------- 네트워크 ---------- */
function getJSON(u){return fetch(u).then(function(res){if(!res.ok) throw new Error(res.status); return res.json();});}
function getWeather(lat,lon){
  return getJSON('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
   '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'+
   '&hourly=temperature_2m,apparent_temperature,precipitation_probability,relative_humidity_2m,wind_speed_10m,uv_index,weather_code'+
   '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,uv_index_max,sunset'+
   '&past_days=1&forecast_days=3&timezone=auto&wind_speed_unit=ms');
}
function getAQ(lat,lon){
  return getJSON('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&hourly=pm2_5&timezone=auto&forecast_days=3');
}
function geocode(q){
  return getJSON('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=ko&format=json')
   .then(function(j){return (j.results||[]).map(function(x){
     return {name:[x.name,x.admin1&&x.admin1!==x.name?x.admin1:null,x.country].filter(Boolean).join(', '),lat:x.latitude,lon:x.longitude};
   });});
}
function reverse(lat,lon){
  return getJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=ko')
   .then(function(j){
     // 행정구역을 큰 단위→작은 단위로 정렬하고, 도시 바로 아래 단계(구·district)를 이름으로 씁니다.
     var adm=((j.localityInfo&&j.localityInfo.administrative)||[]).filter(function(x){return x&&x.name;})
       .sort(function(x,y){return ((x.adminLevel||0)-(y.adminLevel||0))||((x.order||0)-(y.order||0));});
     var city=j.city||'';
     var ci=-1;
     adm.forEach(function(x,i){if(city&&x.name===city)ci=i;});
     var finer=ci>=0?adm.slice(ci+1):adm.filter(function(x){return (x.adminLevel||0)>=7;});
     finer=finer.filter(function(x,i){return x.name!==city&&finer.map(function(y){return y.name;}).indexOf(x.name)===i;});
     var district=finer[0]?finer[0].name:(j.locality&&j.locality!==city?j.locality:'');
     var hood=finer[1]?finer[1].name:(j.locality&&j.locality!==city&&j.locality!==district?j.locality:'');
     var name=[district,city||j.principalSubdivision].filter(Boolean).join(', ')||j.countryName||'';
     return {name:name,hood:hood};
   });
}

var loadToken=0;
function loadPlace(pl){
  S.place=pl; save(); S.cmp=null;
  var my=++loadToken;
  loading=true; status='날씨를 불러오는 중이에요…'; render();
  getWeather(pl.lat,pl.lon).then(function(w){
    if(my!==loadToken) return;
    W=w; status=''; loading=false; render();
  }).catch(function(){
    if(my!==loadToken) return;
    loading=false; status='날씨를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 위쪽 위치 버튼을 눌러 다시 시도해 주세요.'; render();
  });
  AQ=null;
  getAQ(pl.lat,pl.lon).then(function(a){if(my===loadToken){AQ=a;render();}}).catch(function(){});
  HOMEW=null;
  if(distKm(pl,S.home)>300){
    getWeather(S.home.lat,S.home.lon).then(function(h){if(my===loadToken){HOMEW=h;render();}}).catch(function(){});
  }
}
function locate(){
  if(!navigator.geolocation){
    status='이 브라우저는 위치를 지원하지 않아요. 아래에서 도시를 골라 주세요.'; render(); return;
  }
  status='현재 위치를 확인하는 중이에요…'; render();
  navigator.geolocation.getCurrentPosition(function(p){
    var lat=+p.coords.latitude.toFixed(3),lon=+p.coords.longitude.toFixed(3);
    reverse(lat,lon).then(function(n){loadPlace({name:n.name||'현재 위치',hood:n.hood||'',lat:lat,lon:lon,gps:true});})
     .catch(function(){loadPlace({name:'현재 위치',lat:lat,lon:lon,gps:true});});
  },function(){
    status=S.place?'위치 권한이 없어 마지막으로 본 장소의 날씨를 보여드려요.':'위치를 받을 수 없어요. 아래에서 도시를 골라 주세요.';
    if(S.place&&!W) loadPlace(S.place); else render();
  },{enableHighAccuracy:false,timeout:10000,maximumAge:600000});
}

/* ---------- 분석 ---------- */
function fbOffset(){
  var last=S.fb.slice(-10),sum=0;
  last.forEach(function(e){if(e.rating==='cold')sum-=1;else if(e.rating==='hot')sum+=1;});
  return clamp(Math.round(sum*0.7),-4,4);
}
function nowInfo(w){
  var t=w.current.time;
  return {date:t.slice(0,10),h:+t.slice(11,13)};
}
function analyze(forceToday){
  var now=nowInfo(W);
  var di=W.daily.time.indexOf(now.date);
  if(di<0) di=1;
  // evening = 내일 준비 화면. 직접 고르면 그대로, 아니면 저녁 7시부터 자동으로 내일.
  var evening=!forceToday&&(S.day?S.day==='tomorrow':now.h>=19);
  var t=evening?di+1:di;
  if(t>=W.daily.time.length) t=W.daily.time.length-1;
  var date=W.daily.time[t];
  var A=curAct();
  var h0=A.win[0],h1=A.win[1];
  if(S.activity==='sport'&&!evening&&now.h>=6){h0=now.h;h1=Math.min(now.h+2,23);}
  else if(!evening){h0=Math.max(h0,now.h);if(h0>h1)h0=h1;}
  var idx=[];
  W.hourly.time.forEach(function(tm,i){
    if(tm.slice(0,10)===date){var h=+tm.slice(11,13);if(h>=h0&&h<=h1)idx.push(i);}
  });
  if(!idx.length){W.hourly.time.forEach(function(tm,i){if(tm.slice(0,10)===date)idx.push(i);});}
  function H(k){return idx.map(function(i){var v=W.hourly[k][i];return v==null?0:v;});}
  var feel=H('apparent_temperature'),pp=H('precipitation_probability'),hum=H('relative_humidity_2m'),wind=H('wind_speed_10m'),uv=H('uv_index'),code=H('weather_code');
  var hours=idx.map(function(i){return +W.hourly.time[i].slice(11,13);});
  var rainStart=null;
  for(var k=0;k<pp.length;k++){if(pp[k]>=50){rainStart=hours[k];break;}}
  var minFeel=min(feel),maxFeel=max(feel);
  var minHour=hours[feel.indexOf(minFeel)];
  var sunny=code.filter(function(c){return c<=1;}).length/(code.length||1);
  var base=0.6*avg(feel)+0.4*minFeel;
  var Tadj=base+A.mod+SENS[S.sens].v+fbOffset();
  var pm=null;
  if(AQ&&AQ.hourly&&AQ.hourly.time){
    var vals=[];
    AQ.hourly.time.forEach(function(tm,i){
      if(tm.slice(0,10)===date){var h=+tm.slice(11,13);if(h>=h0&&h<=h1&&AQ.hourly.pm2_5[i]!=null)vals.push(AQ.hourly.pm2_5[i]);}
    });
    if(vals.length) pm=max(vals);
  }
  var snow=code.some(function(c){return c>=71&&c<=77||c===85||c===86;});
  return {
    t:t,date:date,evening:evening,forceToday:!!forceToday,now:now,h0:h0,h1:h1,
    avgFeel:avg(feel),minFeel:minFeel,maxFeel:maxFeel,minHour:minHour,
    maxPP:max(pp),rainStart:rainStart,wet:max(pp)>=50,snow:snow,
    hum:avg(hum),wind:max(wind),uv:max(uv),sunny:sunny,pm:pm,
    Tadj:Tadj,
    dMax:W.daily.temperature_2m_max[t],dMin:W.daily.temperature_2m_min[t],dCode:W.daily.weather_code[t],
    sunset:W.daily.sunset&&W.daily.sunset[t]?W.daily.sunset[t].slice(11,16):null
  };
}

function band(T){return T>=27?7:T>=23?6:T>=20?5:T>=17?4:T>=13?3:T>=9?2:T>=5?1:0;}
var WORK=[

 {outer:['trench','leather','lightpad','wool'],base:['thinturtle','tee_l','shirt'],top:['knit','sweat','cardigan'],bottom:['jeans'],shoes:['sneakers']},
 {outer:['leather','denimjk','trench','fleecejk','windbreaker'],base:['thinturtle','tee_l'],top:['cardigan','sweat','knit'],_opt:['top'],bottom:['jeans','cotton'],shoes:['sneakers']},

function copySpec(o){var c={};Object.keys(o).forEach(function(k){c[k]=o[k].slice();});return c;}
function specFor(T,a){
  var b=band(T),act=K(),sp;
  if(act==='work') sp=copySpec(WORK[b]);
  else if(act==='sport'){
    if(b>=5) sp={top:['sporttee','tee_s'],bottom:['shorts','training'],shoes:['sneakers']};
    else if(b>=3) sp={outer:['windbreaker','hoodie'],top:['sporttee','tee_l'],bottom:['training'],shoes:['sneakers']};
    else sp={outer:['windbreaker','lightpad'],inner:['heattech'],top:['hoodie','sporttee'],bottom:['training','fleece'],shoes:['sneakers']};
    if(b<=1) sp.acc=['gloves'];
  } else if(act==='water'){
    var cover=b>=6?{top:['tee_s'],bottom:['shorts']}:copySpec(CASUAL[b]);
    sp={swim:['swim'],guard:['rashguard'],top:cover.top,bottom:cover.bottom,shoes:['aqua','sandals'],acc:['towel']};
    if(cover.base){sp.base=cover.base;sp._opt=['top'];}
    if(cover.outer) sp.outer=cover.outer;
  } else {
    sp=copySpec(CASUAL[b]);
    if(act==='trip'||act==='out'){sp.shoes=['sneakers'].concat(sp.shoes.filter(function(x){return x!=='sneakers';}));}
    if(act==='fish'){
      sp.outer=['windbreaker','rainjacket'].concat(sp.outer||[]);
      sp.shoes=['rainboots','boots','sneakers'];
      sp.acc=(sp.acc||[]).concat(['cap']);
    }
  }
  return injectCustom(sp,b,a);
}
/* 사용자가 추가한 옷: 따뜻함 단계가 맞으면 카탈로그 옷과 하루씩 번갈아 추천 */
var CAT_OF={outer:'아우터',carry:'아우터',base:'상의',top:'상의',bottom:'하의',shoes:'신발'};
function wantWarm(part,b){
  if(part==='outer') return b<=1?[3]:b===2?[3,2]:b===3?[2]:[1];
  if(part==='carry') return [1];
  if(part==='base') return b<=3?[1,2]:[1];
  if(part==='top') return b<=1?[3]:b<=3?[2,3]:b<=5?[1,2]:[1];
  if(part==='bottom') return b<=1?[3]:b<=4?[2]:b<=6?[2,1]:[1];
  return null;
}
function injectCustom(sp,b,a){
  if(!S.custom.length||K()==='sport'||K()==='water') return sp;
  var day=a&&a.date?+a.date.slice(8,10):0;
  Object.keys(sp).forEach(function(part){
    var cat=CAT_OF[part]; if(!cat) return;
    var ws=wantWarm(part,b);
    var layered=part==='top'&&sp.base&&sp.base.length;
    var mine=S.custom.filter(function(c){return S.closet[c.id]&&((c.cat===cat&&(!ws||ws.indexOf(c.warm)>=0))||(layered&&c.cat==='아우터'&&c.warm===1));}).map(function(c){return c.id;});
    if(!mine.length) return;
    if(part==='shoes'){sp[part]=sp[part].concat(mine);return;}
    var cat0=null;
    for(var i=0;i<sp[part].length;i++){if(S.closet[sp[part][i]]){cat0=sp[part][i];break;}}
    var pool=cat0?[cat0].concat(mine):mine;
    var k=day%pool.length;
    pool=pool.slice(k).concat(pool.slice(0,k));
    sp[part]=pool.concat(sp[part].filter(function(x){return pool.indexOf(x)<0;}));
  });
  return sp;
}
var PART_LABEL={outer:'아우터',inner:'이너',guard:'물놀이',swim:'물놀이',top:'상의',bottom:'하의',shoes:'신발',acc:'소품',carry:'들고 가기'};
var PART_ORDER=['swim','guard','outer','top','base','inner','bottom','shoes','acc','carry'];
function resolve(sp){
  var out=[],used={};
  var layered=!!(sp.base&&sp.base.length);
  var opt=sp._opt||[];
  PART_ORDER.forEach(function(p){
    if(!sp[p]||!sp[p].length) return;
    var ids=sp[p].filter(function(x){return !used[x];});
    if(!ids.length) return;
    var label=p==='top'&&layered?'상의 · 겉에':p==='base'?'상의 · 안에':PART_LABEL[p];
    if(p==='acc'){
      ids.forEach(function(id){used[id]=1;out.push({key:p,part:label,id:id,name:NAME[id],owned:!!S.closet[id]});});
      return;
    }
    var pick=null;
    for(var i=0;i<ids.length;i++){if(S.closet[ids[i]]){pick=ids[i];break;}}
    if(pick){used[pick]=1;out.push({key:p,part:label,id:pick,name:NAME[pick],owned:true});}
    else if(opt.indexOf(p)<0){used[ids[0]]=1;out.push({key:p,part:label,id:ids[0],name:NAME[ids[0]],owned:false});}
  });
  return out;
}
function josa(w,a,b){var c=w.charCodeAt(w.length-1);if(c<0xAC00||c>0xD7A3)return w+b;return w+((c-0xAC00)%28?a:b);}
function layerTip(items){
  var base=null,top=null,outer=null;
  items.forEach(function(i){if(i.key==='base')base=i;if(i.key==='top')top=i;if(i.key==='outer')outer=i;});
  if(!base||!top) return '';
  var t=base.name+' 위에 '+josa(top.name,'을','를')+' 겹쳐 입으세요.';
  if(K()==='work') t+=' 사무실이 더우면 '+top.name+'만 벗으면 돼요.';
  else if(outer) t+=' 낮에 '+josa(outer.name,'을','를')+' 벗어도 두 겹이라 허전하지 않아요.';
  return t;
}
function outfits(a){

function baseDesc(a){
  var parts=[];

function summary(items){

/* ---------- 챙길 것 / 메이크업 / 가방 ---------- */
function bring(a){
  var L=[];
  if(a.maxPP>=60) L.push({k:'umbrella',name:'우산',level:'must',note:(a.rainStart!=null?a.rainStart+'시부터 비 · ':'')+'강수확률 '+r(a.maxPP)+'%'});

  else L.push({k:'umbrella',name:'우산',level:'no',note:'강수확률 '+r(a.maxPP)+'%'});
  if(a.uv>=6||(a.uv>=3&&a.sunny>=0.5)) L.push({k:'sunglass',name:'선글라스',level:'must',note:'자외선 '+uvText(a.uv)+(a.sunny>=0.5?' · 맑음':'')});
  else if(a.uv>=3) L.push({k:'sunglass',name:'선글라스',level:'maybe',note:'자외선 '+uvText(a.uv)+' · 구름 많음'});
  else L.push({k:'sunglass',name:'선글라스',level:'no',note:'자외선 '+uvText(a.uv)});

  var range=a.maxFeel-a.minFeel;
  if(range>=8&&a.minFeel<20) L.push({k:'layer',name:'얇은 겉옷',level:'must',note:a.minHour+'시엔 체감 '+r(a.minFeel)+'°'});
  if(a.pm!=null){
    if(a.pm>=36) L.push({k:'mask',name:'마스크',level:'must',note:'초미세먼지 나쁨'});
    else if(a.pm>=16) L.push({k:'mask',name:'마스크',level:'maybe',note:'초미세먼지 보통'});
  }
  if(a.Tadj<5) L.push({k:'warm',name:'장갑·머플러',level:'must',note:'체감 '+r(a.minFeel)+'°까지'});
  if(K()==='sport'||K()==='water'||K()==='fish'||a.maxFeel>=28) L.push({k:'water',name:'물',level:'must',note:a.maxFeel>=28?'체감 '+r(a.maxFeel)+'°':'수분 보충'});
  if(K()==='water') L.push({k:'dry',name:'방수팩',level:'must',note:'휴대폰 보호'});
  if(K()==='fish') L.push({k:'cap',name:'모자',level:'must',note:'햇볕과 바람 막기'});

  var rank={must:0,maybe:1,no:2};
  L.sort(function(x,y){return rank[x.level]-rank[y.level];});

}
function uvText(u){return u>=8?'매우 높음':u>=6?'높음':u>=3?'보통':'낮음';}
function levelText(l){return l==='must'?'꼭':l==='maybe'?'있으면 좋음':'필요 없음';}
function makeup(a){

function bagFor(a,B,items,away){
  var base={work:['노트북','지갑','휴대폰'],out:['지갑','휴대폰'],sport:['물','수건','휴대폰'],water:['비치타월','방수팩','갈아입을 옷'],fish:['물','간식','보조배터리'],trip:['여권·신분증','지갑','보조배터리']}[K()].slice();

  }

}

function compareInfo(a){
  var away=!!HOMEW;
  var mode=S.cmp||(away?'home':'prev');
  if(!away) mode='prev';
  var prevWord=a.evening?'오늘':'어제';
  var targetWord=a.evening?'내일':'오늘';
  if(mode==='home'){
    var hn=nowInfo(HOMEW);
    var hi=HOMEW.daily.time.indexOf(a.date);
    if(hi<0) hi=HOMEW.daily.time.indexOf(hn.date);
    if(hi<0) hi=1;
    var hMax=HOMEW.daily.temperature_2m_max[hi],hMin=HOMEW.daily.temperature_2m_min[hi];
    var d=r(a.dMax-hMax);
    var hHum=avg(HOMEW.hourly.relative_humidity_2m.filter(function(v,i){return HOMEW.hourly.time[i].slice(0,10)===HOMEW.daily.time[hi]&&v!=null;}));
    var humNote='';
    if(a.hum-hHum<=-20) humNote=' 훨씬 건조해요';
    else if(a.hum-hHum>=20) humNote=' 훨씬 습해요';
    var hname=shortName(S.home.name);
    var head=Math.abs(d)<2?wa(hname)+' 기온이 비슷해요':hname+'보다 '+Math.abs(d)+'° '+(d>0?'따뜻해요':'쌀쌀해요');
    if(humNote) head+=','+humNote;
    var advice=d>=4?hname+'에서 입던 두꺼운 겉옷은 두고, 한 겹 가볍게 입으세요.':d<=-4?hname+'보다 추워요. 한 겹 더 입으세요.':hname+'에서 입던 옷차림 그대로 괜찮아요.';
    return {away:true,mode:mode,head:head,advice:advice,
      left:{label:targetWord+' '+hname,t:r(hMax)+'° / '+r(hMin)+'°',note:skyText(HOMEW.daily.weather_code[hi])},
      right:{label:targetWord+' '+shortName(S.place.name),t:r(a.dMax)+'° / '+r(a.dMin)+'°',note:skyText(a.dCode)}};
  }
  var p=a.t-1;
  var pMax=W.daily.temperature_2m_max[p],pMin=W.daily.temperature_2m_min[p];
  var dd=r(a.dMax-pMax);
  var head2=(a.evening?'내일은 ':'')+(Math.abs(dd)<2?wa(prevWord)+' 기온이 비슷해요':prevWord+'보다 '+Math.abs(dd)+'° '+(dd>0?'높아요':'낮아요'));
  var prevDate=W.daily.time[p];
  var fbPrev=null;
  S.fb.forEach(function(e){if(e.date===prevDate)fbPrev=e;});
  var adv=dd<=-3?prevWord+' 옷에 한 겹 더 입으세요.':dd>=3?prevWord+' 옷에서 한 겹 덜어내세요.':wa(prevWord)+' 비슷하게 입으면 돼요.';
  if(fbPrev){
    var rt={cold:'추웠어요',ok:'적당했어요',hot:'더웠어요'}[fbPrev.rating];
    adv+=' '+prevWord+' 저녁 "'+rt+'"를 누르셔서 그 기준으로 맞췄어요.';
    if(fbPrev.outfit) adv+=' ('+prevWord+' 입은 옷: '+fbPrev.outfit+')';
  }
  return {away:away,mode:'prev',head:head2,advice:adv,
    left:{label:prevWord,t:r(pMax)+'° / '+r(pMin)+'°',note:skyText(W.daily.weather_code[p])},
    right:{label:targetWord,t:r(a.dMax)+'° / '+r(a.dMin)+'°',note:skyText(a.dCode)}};
}

/* 사진 불러오기
   - 키 없이 쓰면 IP당 45초에 1장. 한 번에 하나만 요청하고, 45초 간격을 지킵니다.
   - 만든 사진은 브라우저 캐시에 저장해 같은 코디는 다시 요청하지 않아요.
   - 설정에 Pollinations 키를 넣으면 간격 없이 만듭니다. 키는 이 브라우저에만 저장돼요. */
var PHOTO={};          // url -> {st:'ok'|'gen'|'wait'|'err', src}
var WANT=null;         // 지금 화면에 필요한 사진 url
var BUSY=false;
var NEXT_AT=0;         // 다음 요청 가능 시각(ms)
var GAP_MS=46000;
var CACHE_NAME='wxfit-photos-v1';
function genUrl(prompt){
  var q='?width=576&height=864&nologo=true&model=flux&seed='+hashStr(prompt);
  return S.pkey?'https://gen.pollinations.ai/image/'+encodeURIComponent(prompt)+q:'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+q;
}
function cacheGet(url){
  try{ if(!window.caches) return Promise.resolve(null);
    return caches.open(CACHE_NAME).then(function(c){return c.match(url);}).then(function(r){return r?r.blob():null;}).catch(function(){return null;});
  }catch(e){return Promise.resolve(null);}
}
function cachePut(url,blob){
  try{ if(window.caches) caches.open(CACHE_NAME).then(function(c){return c.put(url,new Response(blob,{headers:{'content-type':blob.type||'image/jpeg'}}));}).catch(function(){}); }catch(e){}
}
function setPhoto(url,st,src){PHOTO[url]={st:st,src:src||(PHOTO[url]&&PHOTO[url].src)||null};if(url===WANT&&S.tab==='today')render();}
function want(url){
  WANT=url;
  if(PHOTO[url]&&(PHOTO[url].st==='ok'||PHOTO[url].st==='gen'||PHOTO[url].st==='err')) return;
  if(!PHOTO[url]) PHOTO[url]={st:'wait'};
  cacheGet(url).then(function(b){
    if(b&&b.size>5000){PHOTO[url]={st:'ok',src:URL.createObjectURL(b)};if(url===WANT)render();}
    else pump();
  });
}
var tick=null;
function pump(){
  if(BUSY||!WANT) return;
  var url=WANT;
  if(PHOTO[url]&&(PHOTO[url].st==='ok'||PHOTO[url].st==='err')) return;
  var waitMs=S.pkey?0:NEXT_AT-Date.now();
  if(waitMs>0){
    if(PHOTO[url].st!=='wait') setPhoto(url,'wait');
    clearTimeout(tick); tick=setTimeout(pump,Math.min(waitMs,1000));
    var el=document.getElementById('phCount'); if(el) el.textContent=Math.ceil(waitMs/1000);
    return;
  }
  BUSY=true; setPhoto(url,'gen');
  var headers={'Accept':'image/jpeg, application/json'};
  if(S.pkey) headers['Authorization']='Bearer '+S.pkey;
  var ctl=new AbortController(); var to=setTimeout(function(){ctl.abort();},90000);
  fetch(url,{headers:headers,signal:ctl.signal}).then(function(res){
    clearTimeout(to);
    var ct=res.headers.get('content-type')||'';
    if(res.status===402||res.status===429){
      var ra=+(res.headers.get('retry-after')||45);
      NEXT_AT=Date.now()+Math.max(5,ra)*1000+1000;
      BUSY=false; setPhoto(url,'wait'); pump(); return;
    }
    if(!res.ok||ct.indexOf('image')<0) throw new Error('bad '+res.status);
    return res.blob().then(function(b){
      NEXT_AT=Date.now()+(S.pkey?0:GAP_MS);
      cachePut(url,b);
      BUSY=false; setPhoto(url,'ok',URL.createObjectURL(b)); pump();
    });
  }).catch(function(){
    clearTimeout(to);
    BUSY=false; NEXT_AT=Date.now()+(S.pkey?0:GAP_MS); setPhoto(url,'err'); pump();
  });
}

    '<div class="small muted">무료로는 45초에 1장씩 만들어요. <a href="https://enter.pollinations.ai" target="_blank" rel="noopener">enter.pollinations.ai</a>에서 무료 가입 후 받은 키를 넣으면 기다리지 않아요. 키는 이 휴대폰 브라우저에만 저장돼요.</div>'+
    '<div class="search"><label for="pkey" style="position:absolute;left:-9999px">Pollinations 키</label><input id="pkey" type="password" autocomplete="off" placeholder="키 붙여넣기 (선택)" value="'+esc(S.pkey)+'"><button class="btn" data-a="pkeySave">저장</button></div>'+
    (S.pkey?'<div class="chips"><span class="badge ok">키 사용 중</span><button class="btn ghost" data-a="pkeyClear">키 지우기</button></div>':'')+'</section>';
  h+='<section class="card"><div class="row"><h2>메이크업 팁 보기</h2><button class="chip" data-a="makeup" aria-pressed="'+S.makeup+'">'+(S.makeup?'켜짐':'꺼짐')+'</button></div></section>';
  h+='<section class="card"><h2>집(기준 도시)</h2><div class="small">지금: <b>'+esc(S.home.name)+'</b>. 300km 넘게 떠나 있으면 이 도시와 비교해 드려요.</div></section>';
  h+=pickerCard('home','기준 도시 바꾸기');
  h+=pickerCard('place','다른 도시 날씨 보기');
  h+='<section class="card"><h2>기록 지우기</h2>';
  if(S.confirmReset) h+='<div class="small">옷장, 설정, 피드백 기록이 모두 지워져요.</div><div class="chips"><button class="btn" data-a="resetYes">모두 지우기</button><button class="btn ghost" data-a="resetNo">취소</button></div>';
  else h+='<div class="chips"><button class="btn ghost" data-a="reset">이 기기의 기록 지우기</button></div>';
  return h+'</section>';
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el) return;
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  switch(a){
    case 'tab': S.tab=v; break;
    case 'locate': locate(); return;
    case 'act': S.activity=v; S.opt=0; save(); break;
    case 'actAdd': S.addingAct=!S.addingAct; S.actMsg=''; break;
    case 'actCancel': S.addingAct=false; S.actMsg=''; break;
    case 'preset': var pr=PRESETS[+v]; S.na={label:pr.label,base:pr.base,h0:pr.h0,h1:pr.h1,io:pr.io}; S.actMsg=''; break;
    case 'naBase': readNa(); S.na.base=v; break;
    case 'naIO': readNa(); S.na.io=+v; break;
    case 'actSave':
      readNa();
      var nm=S.na.label.trim();
      if(!nm){S.actMsg='활동 이름을 적어 주세요.';break;}
      if(S.na.h1<S.na.h0){S.actMsg='끝나는 시각이 시작보다 빨라요. 같은 날 안의 시간대로 골라 주세요.';break;}
      if(S.acts.some(function(x){return x.label===nm;})||ACT_ORDER.some(function(k){return ACT[k].label===nm;})){S.actMsg='"'+nm+'"은(는) 이미 있어요.';break;}
      var nid='a_'+Date.now().toString(36);
      S.acts.push({id:nid,label:nm,base:S.na.base,h0:S.na.h0,h1:S.na.h1,io:S.na.io});
      S.activity=nid; S.opt=0; S.addingAct=false; S.actMsg=''; S.na={label:'',base:'out',h0:9,h1:18,io:1}; save(); break;
    case 'actDel':
      S.acts=S.acts.filter(function(x){return x.id!==v;});
      if(S.activity===v) S.activity='work';
      save(); break;
    case 'opt': S.opt=+v; break;
    case 'cmp': S.cmp=v; break;
    case 'closet': S.closet[v]=!S.closet[v]; save(); break;
    case 'sens': S.sens=+v; save(); break;
    case 'makeup': S.makeup=!S.makeup; save(); break;
    case 'look': S.look=v; save(); break;
    case 'phRetry': if(WANT&&PHOTO[WANT]) PHOTO[WANT].st='wait'; pump(); break;
    case 'pkeySave': var kv=(document.getElementById('pkey')||{}).value||''; S.pkey=kv.trim(); save(); PHOTO={}; NEXT_AT=0; break;
    case 'pkeyClear': S.pkey=''; save(); PHOTO={}; break;
    case 'model': S.model=v; save(); break;
    case 'rate': rate(v); break;
    case 'moment': moment(v); break;
    case 'quick': choose(el.getAttribute('data-mode'),QUICK[+el.getAttribute('data-i')]); return;
    case 'pickResult': choose(el.getAttribute('data-mode'),S.results[+el.getAttribute('data-i')]); return;
    case 'newCat': S.newCat=v; S.newName=(document.getElementById('newName')||{}).value||''; S.addMsg=''; break;
    case 'newWarm': S.newWarm=+v; S.newName=(document.getElementById('newName')||{}).value||''; break;
    case 'delItem':
      var gone=null;
      S.custom=S.custom.filter(function(c){if(c.id===v){gone=c;return false;}return true;});
      delete S.closet[v]; save(); S.addMsg=gone?'"'+gone.name+'"을(를) 옷장에서 뺐어요.':''; break;
    case 'day': S.day=v; S.opt=0; break;
    case 'plan':
      if(W){
        var pa=analyze(false),po=outfits(pa)[S.opt]||outfits(pa)[0],pn=nowInfo(W);
        S.plan={date:pa.date,activity:S.activity,label:po.label,summary:po.items.map(function(i){return i.name;}).join(' + '),
          dMax:pa.dMax,maxPP:pa.maxPP,setOn:pn.date,setH:pn.h};
        save();
      }
      break;
    case 'unplan': S.plan=null; save(); break;
    case 'reset': S.confirmReset=true; break;
    case 'resetNo': S.confirmReset=false; break;
    case 'resetYes':
      try{localStorage.removeItem(KEY);}catch(e){}
      var keepPlace=S.place; S=load(); S.place=keepPlace; S.tab='set'; save(); break;
  }
  render();
});
document.addEventListener('submit',function(ev){
  var af=ev.target.closest('[data-form="addItem"]');
  if(af){
    ev.preventDefault();
    var n=af.querySelector('input').value.trim().slice(0,20);
    if(!n){S.addMsg='옷 이름을 적어 주세요.';render();return;}
    var dup=S.custom.some(function(c){return c.name===n&&c.cat===S.newCat;});
    if(dup){S.addMsg='"'+n+'"은(는) 이미 있어요.';S.newName='';render();return;}
    var id='c_'+Date.now().toString(36);
    S.custom.push({id:id,name:n,cat:S.newCat,warm:WARM[S.newCat]?S.newWarm:0});
    NAME[id]=n; S.closet[id]=true; S.newName='';
    S.addMsg='"'+n+'"을(를) '+S.newCat+'에 추가했어요. 날씨가 맞는 날 코디에 나와요.';
    save(); render();
    var inp=document.getElementById('newName'); if(inp) inp.focus();
    return;
  }
  var f=ev.target.closest('[data-form="search"]'); if(!f) return;
  ev.preventDefault();
  var q=f.querySelector('input').value.trim(); if(!q) return;
  S.q=q; S.qMode=f.getAttribute('data-mode'); S.searching=true; S.results=[]; render();
  geocode(q).then(function(res){S.searching=false;S.results=res;if(!res.length)S.results.noHit=true;render();})
    .catch(function(){S.searching=false;status='도시 검색에 실패했어요. 인터넷 연결을 확인해 주세요.';render();});
});
function readNa(){
  var a=document.getElementById('actName'),h0=document.getElementById('naH0'),h1=document.getElementById('naH1');
  if(a) S.na.label=a.value; if(h0) S.na.h0=+h0.value; if(h1) S.na.h1=+h1.value;
}
function choose(mode,pl){
  if(!pl) return;
  S.results=[]; S.q='';
  if(mode==='home'){ S.home={name:pl.name,lat:pl.lat,lon:pl.lon}; save(); if(S.place) loadPlace(S.place); else render(); }
  else { S.tab='today'; loadPlace({name:pl.name,lat:pl.lat,lon:pl.lon,gps:false}); }
}
function rate(v){
  if(!W) return;
  var a=analyze(true),today=a.date;
  var outfit=summary(outfits(a)[0].items);
  var found=false;
  S.fb.forEach(function(e){if(e.date===today){e.rating=v;e.outfit=outfit;found=true;}});
  if(!found) S.fb.push({date:today,rating:v,outfit:outfit,moments:[],place:shortName(S.place.name)});
  S.fb.sort(function(x,y){return x.date<y.date?-1:1;});
  if(S.fb.length>60) S.fb=S.fb.slice(-60);
  save();
}
function moment(v){
  if(!W) return;
  var today=analyze(true).date;
  S.fb.forEach(function(e){if(e.date===today){e.moments=e.moments||[];var i=e.moments.indexOf(v);if(i>=0)e.moments.splice(i,1);else e.moments.push(v);}});
  save();
}

/* ---------- 시작 ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
render();
if(S.place) loadPlace(S.place);
locate();
})();
</script>
